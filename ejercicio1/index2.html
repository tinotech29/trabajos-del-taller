<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .caja1{
            display:flex;
            justify-content:center;
            align-items:center;
            background-color: aqua;
            height: 300px;
            width: 300px;
            flex-direction:column;
        }
        .caja2{
            display:flex;
            justify-content:flex-start;
            align-items:flex-start;
            background-color: blue;
            height: 500px;
            width: 500px;
            

        }
        body{
            display:flex;
            justify-content:flex-end;
            align-items:flex-start;
            height: 100vh;
            
        }

    </style>
</head>
<body>
   
    <div class="caja2"> 
    <div class="caja1">
    <h1>flexbox</h1>
    <h1>css</h1>
    <h1>html</h1>

    </div>

    </div>
   

</body>
</html>
