<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .caja1{
            display:flex;
            justify-content:center;
            align-items:center;
            background-color: rgb(0, 255, 149);
            height: 300px;
            width:300px;
            flex-direction: column;
            padding:20px;

        }
        .caja2{
            display:flex;
            justify-content:center;
            align-items:center;
            background-color: rgb(40, 73, 47);
            height: 500px;
            width:500px
            



        }


        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height: 100vh;
            margin: 0;
            padding: 0;



        }
    </style>
</head>
<body>
    <div class="caja2">
    <div class="caja1">
        <h1>Flexbox</h1>
        <p>es un modelo de maquetación CSS3 unidimensional diseñado para alinear y distribuir elementos dentro de un contenedor, incluso con tamaños desconocidos o dinámicos. </p>
    </div>
    </div>
   
  
    
</body>
</html>
